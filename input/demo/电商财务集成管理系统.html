      cls: 'wf-baseline',
    });
  }

  const label = '瀑布图：' + bars.length + ' 个节点';
  return renderSvg({ width: W, height, type: 'waterfall', label, children: body });
}

/* =========================================================================
 * 6. 迷你趋势线
 * ========================================================================= */

/**
 * 迷你趋势线（适合 KPI 卡片/表格内嵌）。
 * @param {object} options
 * @param {Array<number|null>} options.values
 * @param {number} [options.width=120] viewBox 宽度
 * @param {number} [options.height=32] viewBox 高度
 * @param {string} [options.color] 线条颜色，默认取主题第一个色
 * @param {(value:number)=>string} [options.valueFormat] 默认紧凑格式
 * @returns {string} SVG 字符串
 */
function sparkline(options) {
  const opt = options || {};
  const values = (Array.isArray(opt.values) ? opt.values : []).map(finiteOrNull);
  const width = clamp(Number(opt.width) || 120, 40, 1000);
  const height = clamp(Number(opt.height) || 32, 20, 300);
  const color = safeColor(opt.color, 0);
  const formatter = pickFormatter(opt.valueFormat || formatCompact);
  const finite = values.filter((v) => v !== null);

  if (!values.length || !finite.length || allNearZero(finite)) {
    return placeholder(width, height, '暂无数据', 'sparkline');
  }

  const padX = 3;
  const padY = 4;
  const innerW = Math.max(1, width - padX * 2);
  const innerH = Math.max(1, height - padY * 2);
  let minValue = Math.min(...finite);
  let maxValue = Math.max(...finite);
  if (minValue === maxValue) {
    minValue -= Math.abs(minValue) * 0.1 || 1;
    maxValue += Math.abs(maxValue) * 0.1 || 1;
  }
  const span = maxValue - minValue;
  const x = (index) => {
    if (values.length <= 1) return padX + innerW / 2;
    return padX + (innerW * index) / (values.length - 1);
  };
  const y = (value) => padY + ((maxValue - value) / span) * innerH;
  const baseY = height - padY;

  let d = '';
  let areaD = '';
  let started = false;
  let runStart = null;
  let runLast = null;
  for (let i = 0; i < values.length; i++) {
    const value = values[i];
    if (value === null) {
      if (runStart !== null && runLast !== null && runLast > runStart) {
        areaD += ' M ' + num(x(runStart)) + ' ' + num(baseY);
        for (let k = runStart; k <= runLast; k++) {
          if (values[k] === null) continue;
          areaD += ' L ' + num(x(k)) + ' ' + num(y(values[k]));
        }
        areaD += ' L ' + num(x(runLast)) + ' ' + num(baseY) + ' Z';
      }
      started = false;
      runStart = null;
      runLast = null;
      continue;
    }
    d += (started ? ' L ' : ' M ') + num(x(i)) + ' ' + num(y(value));
    started = true;
    if (runStart === null) runStart = i;
    runLast = i;
  }
  if (runStart !== null && runLast !== null && runLast > runStart) {
    areaD += ' M ' + num(x(runStart)) + ' ' + num(baseY);
    for (let k = runStart; k <= runLast; k++) {
      if (values[k] === null) continue;
      areaD += ' L ' + num(x(k)) + ' ' + num(y(values[k]));
    }
    areaD += ' L ' + num(x(runLast)) + ' ' + num(baseY) + ' Z';
  }

  let body = '';
  if (areaD) {
    body += pathEl(areaD, { cls: 'spark-area', fill: color, fillOpacity: 0.1 });
  }
  body += pathEl(d, {
    cls: 'spark-line',
    fill: 'none',
    stroke: color,
    strokeWidth: 1.5,
  });

  const lastFiniteIndex = (() => {
    for (let i = values.length - 1; i >= 0; i--) if (values[i] !== null) return i;
    return -1;
  })();
  for (let i = 0; i < values.length; i++) {
    const value = values[i];
    if (value === null) continue;
    const isLast = i === lastFiniteIndex;
    body += circleEl(x(i), y(value), isLast ? 2.2 : 1.2, {
      cls: isLast ? 'spark-point spark-last' : 'spark-point',
      fill: color,
      stroke: isLast ? C.surface : null,
      strokeWidth: isLast ? 1.2 : 0,
      title: '第' + (i + 1) + '点：' + formatter(value),
      attrs: { 'data-index': i, 'data-value': num(value) },
    });
  }

  const label = '迷你趋势图：' + finite.length + ' 个数据点';
  return renderSvg({ width, height, type: 'sparkline', label, children: body });
}

/* =========================================================================
 * 7. 进度条（辅助控件，也返回 SVG，便于统一插入容器）
 * ========================================================================= */

/**
 * 进度条（库存周转/目标完成等）。
 * @param {object} options
 * @param {number} options.value 当前值
 * @param {number} options.max 目标值（必须 > 0）
 * @param {string} [options.color]
 * @param {string} [options.label]
 * @param {number} [options.width=320]
 * @param {number} [options.height=38]
 * @param {(value:number)=>string} [options.valueFormat] 用于 tooltip
 * @returns {string} SVG 字符串
 */
function progressBar(options) {
  const opt = options || {};
  const value = finiteOrNull(opt.value);
  const max = finiteOrNull(opt.max);
  const width = clamp(Number(opt.width) || 320, 80, 1200);
  const height = clamp(Number(opt.height) || 38, 26, 120);
  const formatter = pickFormatter(opt.valueFormat);
  const color = safeColor(opt.color, 0);
  const label = opt.label == null ? '' : String(opt.label);

  if (value === null || max === null || !(max > 0)) {
    return placeholder(width, height, '暂无进度', 'progress');
  }

  const ratio = clamp(value / max, 0, 1);
  const percent = value / max * 100;
  const pctText = (Math.round(percent * 10) / 10) + '%';
  const barHeight = Math.min(10, height * 0.28);
  const barY = label ? height - barHeight - 4 : height / 2 - barHeight / 2;
  const pctWidth = textWidth(pctText, 9.5);
  const trackWidth = label ? width : Math.max(20, width - pctWidth - 10);

  let body = '';
  if (label) {
    body += textEl(0, 11, truncateToWidth(label, width - pctWidth - 8, 10.5), {
      size: 10.5,
      fill: C.text,
      cls: 'pb-label',
    });
    body += textEl(width, 11, pctText, {
      anchor: 'end',
      size: 9.5,
      weight: 600,
      fill: C.text,
      cls: 'pb-value',
    });
  } else {
    body += textEl(width, height / 2 + 3.5, pctText, {
      anchor: 'end',
      size: 9.5,
      weight: 600,
      fill: C.text,
      cls: 'pb-value',
    });
  }

  body += rectEl(label ? 0 : 0, barY, trackWidth, barHeight, {
    rx: barHeight / 2,
    fill: C.track,
    cls: 'pb-track',
    title: (label || '进度') + '：' + formatter(value) + ' / ' + formatter(max),
  });
  body += rectEl(0, barY, Math.max(0, trackWidth * ratio), barHeight, {
    rx: barHeight / 2,
    fill: color,
    cls: 'pb-fill',
    title: (label || '进度') + '：' + formatter(value) + ' / ' + formatter(max) + '（' + pctText + '）',
    attrs: { 'data-pct': num(percent), 'data-ratio': num(ratio) },
  });

  const chartLabel = (label || '进度') + '：' + pctText;
  return renderSvg({ width, height, type: 'progress', label: chartLabel, children: body });
}

/* =========================================================================
 * 导出
 * ========================================================================= */

const Charts = {
  lineChart,
  stackedBarChart,
  hBarChart,
  donutChart,
  waterfallChart,
  sparkline,
  progressBar,
  formatCompact,
  formatNumber,
  escapeXml,
  palette: PALETTE.slice(),
};

// CommonJS（Node 测试 / 构建脚本）
if (typeof module !== 'undefined' && module.exports) module.exports = Charts;

// 浏览器单文件场景：挂到 window.Charts 供界面层调用
if (typeof window !== 'undefined') window.Charts = Charts;

    cols.forEach(function (c) {
      var cls = [c.num ? 'num' : '', c.sortable ? 'sortable' : '', c.cls || ''].join(' ');
      var arrow = c.sortable && sort.key === c.key ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
      h += '<th class="' + cls + '"' + (c.sortable ? ' data-sort="' + esc(c.key) + '"' : '') +
        (c.width ? ' style="width:' + c.width + '"' : '') + '>' + esc(c.label) + arrow + '</th>';
    });
    h += '</tr></thead><tbody>';
    if (!rows.length) {
      h += '<tr><td colspan="' + cols.length + '"><div class="empty">暂无数据</div></td></tr>';
    }
    rows.forEach(function (row, i) {
      var attrs = opts.rowAttrs ? opts.rowAttrs(row, i) : '';
      h += '<tr ' + attrs + '>';
      cols.forEach(function (c) {
        var content = c.render ? c.render(row, i) : esc(row[c.key]);
        var cls = [c.num ? 'num' : '', c.cls || ''].join(' ');
        h += '<td class="' + cls + '">' + content + '</td>';
      });
      h += '</tr>';
    });
    if (opts.footer && opts.footer.length) {
      h += '<tr class="total-row">' + opts.footer.map(function (cell) {
        return '<td class="' + (cell.num ? 'num' : '') + '">' + (cell.html !== undefined ? cell.html : esc(cell)) + '</td>';
      }).join('') + '</tr>';
    }
    h += '</tbody></table></div>';
    return h;
  }

  function csvText(headers, rows) {
    function cell(v) {
      var s = v === undefined || v === null ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    return '\ufeff' + [headers.map(cell).join(',')].concat(rows.map(function (r) { return r.map(cell).join(','); })).join('\r\n');
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 300);
  }
  function downloadCsv(filename, headers, rows) {
    download(filename, csvText(headers, rows), 'text/csv;charset=utf-8');
  }

  function modal(opts) {
    var root = document.getElementById('modal-root');
    root.innerHTML =
      '<div class="modal-mask" data-close-modal></div>' +
      '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><div><h3>' + esc(opts.title || '') + '</h3>' +
      (opts.subtitle ? '<p>' + esc(opts.subtitle) + '</p>' : '') + '</div>' +
      '<button class="btn ghost close" data-close-modal aria-label="关闭">' + icon('close', 18) + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div></div>';
    root.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    var root = document.getElementById('modal-root');
    root.classList.remove('open');
    root.innerHTML = '';
    document.body.style.overflow = '';
  }

  function toast(msg, type) {
    var box = document.getElementById('toast');
    if (!box) return;
    var el = document.createElement('div');
    el.className = 'item ' + (type || 'ok');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () { el.remove(); }, 4200);
  }

  function badge(text, kind) {
    return '<span class="badge ' + (kind || 'neutral') + '">' + esc(text) + '</span>';
  }
  function platformName(p) { return p === 'xhs' ? '小红书' : p === 'taobao' ? '淘宝/天猫' : p; }
  function monthLabel(m) { return m === 'all' ? '全部账期' : Number(m.slice(5, 7)) + '月'; }
  function fullMonth(m) { return m === 'all' ? '全部账期' : m.slice(0, 4) + '年' + Number(m.slice(5, 7)) + '月'; }

  root.UI = {
    esc: esc, num: num, money: money, money2: money2, wan: wan, pct: pct, rate: rate,
    delta: delta, signCls: signCls, icon: icon, table: table, sortRows: sortRows,
    csvText: csvText, download: download, downloadCsv: downloadCsv, modal: modal, closeModal: closeModal,
    toast: toast, badge: badge, platformName: platformName, monthLabel: monthLabel, fullMonth: fullMonth
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 业务页面：店铺 / 商品 / 结算 / 物流 / 库存 / 工资 / 发票 */
(function (root) {
  'use strict';
  var UI = root.UI, Charts = root.Charts;
  var Views = {};

  function monthLabel(ctx) { return UI.fullMonth(ctx.month); }
  function scopeName(ctx) { return ctx.store === 'all' ? '全部店铺' : '单店'; }
  function sortOf(ctx, fallbackKey, fallbackDir) {
    var s = ctx.sort || {};
    return { key: s.key || fallbackKey, dir: s.dir || fallbackDir || 'desc' };
  }
  function exportBtn() { return ''; }

  // ================= 店铺利润 =================
  Views.stores = function (ctx) {
    var model = ctx.model, month = ctx.month;
    var rows = ctx.storeRows().filter(function (r) { return ctx.store === 'all' || r.store_id === ctx.store; });
    var sort = sortOf(ctx, 'netProfit', 'desc');
    rows = UI.sortRows(rows, sort.key, sort.dir, true);
    var tot = rows.reduce(function (a, r) {
      ['gmv', 'revenue', 'cogs', 'freight', 'platformFees', 'promotion', 'labor', 'other', 'netProfit'].forEach(function (k) { a[k] = (a[k] || 0) + (r[k] || 0); });
      return a;
    }, {});
    var totalNet = tot.netProfit || 1;

    var html = '<div class="page-head"><div><div class="eyebrow">Stores</div><h2>店铺利润</h2>' +
      '<p>' + monthLabel(ctx) + ' · ' + scopeName(ctx) + ' · 平台费用取账单实际值，公共费用按收入占比分摊</p></div>' +
      '<div class="head-actions"><button class="btn" data-action="go" data-page="settlement">' + UI.icon('settlement') + '查看对账</button></div></div>';

    html += '<div class="card"><div class="panel-head"><h3>店铺损益表</h3><span class="sub">' + monthLabel(ctx) + ' · 点击行看月度明细</span></div><div class="panel-body flush">' +
      UI.table({
        sort: sort,
        rowAttrs: function (r) { return 'class="clickable" data-drill="store" data-id="' + r.store_id + '"'; },
        columns: [
          { key: 'name', label: '店铺', render: function (r) { return '<span class="name">' + UI.esc(r.name) + '</span><span class="sub">' + UI.esc(UI.platformName(r.platform)) + ' · ' + r.store_id + '</span>'; } },
          { key: 'gmv', label: 'GMV', num: true, sortable: true, render: function (r) { return UI.money(r.gmv); } },
          { key: 'revenue', label: '营业收入', num: true, sortable: true, render: function (r) { return UI.money(r.revenue); } },
          { key: 'cogs', label: '商品成本', num: true, sortable: true, render: function (r) { return UI.money(r.cogs); } },
          { key: 'freight', label: '物流', num: true, sortable: true, render: function (r) { return UI.money(r.freight); } },
          { key: 'platformFees', label: '平台费', num: true, sortable: true, render: function (r) { return UI.money(r.platformFees); } },
          { key: 'promotion', label: '推广', num: true, sortable: true, render: function (r) { return UI.money(r.promotion); } },
          { key: 'labor', label: '人工', num: true, sortable: true, render: function (r) { return UI.money(r.labor); } },
          { key: 'other', label: '其他', num: true, sortable: true, render: function (r) { return UI.money(r.other); } },
          { key: 'netProfit', label: '净利润', num: true, sortable: true, render: function (r) { return '<b class="' + UI.signCls(r.netProfit) + '">' + UI.money(r.netProfit) + '</b>'; } },
          { key: 'netMargin', label: '净利率', num: true, sortable: true, render: function (r) { return UI.pct(r.netMargin); } },
          { key: 'share', label: '利润占比', num: true, sortable: true, render: function (r) { return UI.pct(r.netProfit / totalNet * 100); } }
        ],
        rows: rows,
        footer: [{ html: '<b>合计</b>' },
          { html: '<b>' + UI.money(tot.gmv) + '</b>', num: true }, { html: '<b>' + UI.money(tot.revenue) + '</b>', num: true },
          { html: UI.money(tot.cogs), num: true }, { html: UI.money(tot.freight), num: true }, { html: UI.money(tot.platformFees), num: true },
          { html: UI.money(tot.promotion), num: true }, { html: UI.money(tot.labor), num: true }, { html: UI.money(tot.other), num: true },
          { html: '<b>' + UI.money(tot.netProfit) + '</b>', num: true },
          { html: UI.pct(tot.revenue ? tot.netProfit / tot.revenue * 100 : 0), num: true }, { html: '100%', num: true }]
      }) + '</div></div>';

    html += '<div class="grid grid-12" style="margin-top:14px"><div class="card span-7"><div class="panel-head"><h3>各店净利润走势</h3><span class="sub">按订单与账单计算</span></div>' +
      '<div class="panel-body"><div class="chart">' + Charts.lineChart({
        xLabels: model.months.map(function (m) { return Number(m.slice(5, 7)) + '月'; }),
        series: model.stores.filter(function (s) { return ctx.store === 'all' || s.id === ctx.store; }).map(function (s, i) {
          var colors = ['var(--chart-1)', 'var(--chart-4)', 'var(--chart-6)'];
          return { name: s.name.replace(/（.*?）/, ''), color: colors[i % 3], points: model.months.map(function (m) { return model.storeMonth[s.id][m].netProfit; }) };
        }),
        height: 240, valueFormat: function (v) { return UI.wan(v); }
      }) + '</div></div></div>' +
      '<div class="card span-5"><div class="panel-head"><h3>成本率对比</h3><span class="sub">占营业收入</span></div><div class="panel-body">' +
      rows.map(function (r) {
        return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>' + UI.esc(r.name) + '</span>' +
          '<span class="mono">净利率 ' + UI.pct(r.netMargin) + '</span></div>' +
          '<div style="height:6px;background:var(--paper-2);border-radius:3px;margin-top:5px;overflow:hidden"><i style="display:block;height:100%;width:' +
          Math.max(2, Math.min(100, r.revenue ? (r.cogs / r.revenue) * 100 : 0)) + '%;background:var(--chart-1)"></i></div>' +
          '<div class="tiny muted" style="margin-top:3px">商品成本率 ' + UI.pct(r.revenue ? r.cogs / r.revenue * 100 : 0) +
          ' · 推广率 ' + UI.pct(r.revenue ? r.promotion / r.revenue * 100 : 0) + '</div></div>';
      }).join('') + '</div></div></div>';

    ctx.setExport('店铺利润-' + (month === 'all' ? '全部' : month) + '.csv',
      ['店铺', '平台', 'GMV', '营业收入', '商品成本', '物流', '平台费', '推广', '人工', '其他', '净利润', '净利率(%)', '利润占比(%)'],
      rows.map(function (r) {
        return [r.name, UI.platformName(r.platform), r.gmv, r.revenue, r.cogs, r.freight, r.platformFees, r.promotion, r.labor, r.other, r.netProfit, r.netMargin, r.netProfit / totalNet * 100];
      }));
    return { html: html };
  };

  // ================= 商品利润 =================
  Views.products = function (ctx) {
    var model = ctx.model;
    var rows = model.skuMonth.filter(function (r) {
      return (ctx.month === 'all' || r.month === ctx.month) && (ctx.store === 'all' || r.store_id === ctx.store);
    });
    var agg = {};
    rows.forEach(function (r) {
      var a = agg[r.sku_id] || (agg[r.sku_id] = {
        sku_id: r.sku_id, sku_name: r.sku_name, category: r.category,
        qty: 0, revenue: 0, refundAmount: 0, cogs: 0, grossProfit: 0, refundQty: 0
      });
      a.qty += r.qty; a.revenue += r.revenue; a.refundAmount += r.refundAmount;
      a.cogs += r.cogs; a.grossProfit += r.grossProfit; a.refundQty += r.refundQty;
    });
    var invMap = {};
    model.inventory.bySku.forEach(function (b) { invMap[b.sku_id] = b; });
    var list = Object.keys(agg).map(function (k) {
      var a = agg[k];
      var inv = invMap[k] || {};
      a.netRevenue = a.revenue - a.refundAmount;
      a.grossMargin = a.netRevenue ? a.grossProfit / a.netRevenue * 100 : 0;
      a.stockQty = inv.closingQty || 0;
      a.stockValue = inv.closingValue || 0;
      a.slow = !!inv.slowMoving;
      return a;
    });
    var sort = sortOf(ctx, 'grossProfit', 'desc');
    list = UI.sortRows(list, sort.key, sort.dir, true);
    var top = list.slice().sort(function (a, b) { return b.grossProfit - a.grossProfit; }).slice(0, 10);
    var total = list.reduce(function (a, r) { a.revenue += r.revenue; a.refundAmount += r.refundAmount; a.cogs += r.cogs; a.grossProfit += r.grossProfit; a.qty += r.qty; return a; }, { revenue: 0, refundAmount: 0, cogs: 0, grossProfit: 0, qty: 0 });

    var html = '<div class="page-head"><div><div class="eyebrow">Products</div><h2>商品利润</h2>' +
      '<p>' + monthLabel(ctx) + ' · ' + list.length + ' 个 SKU 有成交 · 成本按移动加权平均</p></div></div>';

    html += '<div class="grid grid-12"><div class="card span-8"><div class="panel-head"><h3>SKU 毛利排行</h3><span class="sub">' + monthLabel(ctx) + ' · 按毛利</span></div>' +
      '<div class="panel-body">' + UI.table({
        sort: sort,
        rowAttrs: function (r) { return 'class="clickable" data-drill="sku" data-id="' + r.sku_id + '"'; },
        columns: [
          { key: 'sku_name', label: '商品', render: function (r) { return '<span class="name">' + UI.esc(r.sku_name) + '</span><span class="sub">' + UI.esc(r.category) + (r.slow ? ' · 滞销' : '') + '</span>'; } },
          { key: 'qty', label: '销量', num: true, sortable: true },
          { key: 'netRevenue', label: '净收入', num: true, sortable: true, render: function (r) { return UI.money(r.netRevenue); } },
          { key: 'cogs', label: '成本', num: true, sortable: true, render: function (r) { return UI.money(r.cogs); } },
          { key: 'grossProfit', label: '毛利', num: true, sortable: true, render: function (r) { return '<b>' + UI.money(r.grossProfit) + '</b>'; } },
          { key: 'grossMargin', label: '毛利率', num: true, sortable: true, render: function (r) { return UI.pct(r.grossMargin); } },
          { key: 'stockQty', label: '库存', num: true, sortable: true, render: function (r) { return UI.num(r.stockQty); } },
          { key: 'stockValue', label: '库存金额', num: true, sortable: true, render: function (r) { return UI.money(r.stockValue); } }
        ],
        rows: list,
        footer: [{ html: '<b>合计</b>' }, { html: '<b>' + UI.num(total.qty) + '</b>', num: true },
          { html: '<b>' + UI.money(total.revenue - total.refundAmount) + '</b>', num: true }, { html: UI.money(total.cogs), num: true },
          { html: '<b>' + UI.money(total.grossProfit) + '</b>', num: true },
          { html: UI.pct((total.revenue - total.refundAmount) ? total.grossProfit / (total.revenue - total.refundAmount) * 100 : 0), num: true },
          { html: '—', num: true }, { html: '—', num: true }]
      }) + '</div></div>';

    html += '<div class="card span-4"><div class="panel-head"><h3>毛利 Top 10</h3><span class="sub">金额</span></div><div class="panel-body"><div class="chart">' +
      Charts.hBarChart({
        items: top.map(function (r, i) { return { label: r.sku_name, value: r.grossProfit, meta: UI.pct(r.grossMargin) }; }),
        height: 330, valueFormat: function (v) { return UI.wan(v); }
      }) + '</div><p class="hint" style="margin-top:8px">毛利率为「净收入 − 商品成本」口径，不含物流与平台费用。</p></div></div></div>';

    ctx.setExport('商品利润-' + (ctx.month === 'all' ? '全部' : ctx.month) + '.csv',
      ['商品编码', '商品', '类目', '销量', '收入', '退款', '净收入', '商品成本', '毛利', '毛利率(%)', '期末库存', '库存金额', '滞销'],
      list.map(function (r) {
        return [r.sku_id, r.sku_name, r.category, r.qty, r.revenue, r.refundAmount, r.netRevenue, r.cogs, r.grossProfit, r.grossMargin, r.stockQty, r.stockValue, r.slow ? '是' : '否'];
      }));
    return { html: html };
  };

  // ================= 平台结算 =================
  Views.settlement = function (ctx) {
    var model = ctx.model;
    var bills = model.reconciliation.bills.filter(function (b) { return ctx.store === 'all' || b.store_id === ctx.store; });
    if (ctx.month !== 'all') bills = bills.filter(function (b) { return b.period === ctx.month; });
    bills = bills.slice().sort(function (a, b) { return a.period < b.period ? 1 : -1; });
    var sum = bills.reduce(function (a, b) {
      ['gmv', 'refund', 'commission', 'techFee', 'paymentFee', 'promotion', 'insurance', 'subsidy', 'settledAmount', 'recomputed', 'diff'].forEach(function (k) { a[k] = (a[k] || 0) + b[k]; });
      return a;
    }, {});
    var pending = bills.filter(function (b) { return b.status === 'pending'; });
    var pendingAmt = pending.reduce(function (s, b) { return s + b.settledAmount; }, 0);
    var diffBills = bills.filter(function (b) { return b.hasDiff; });

    var html = '<div class="page-head"><div><div class="eyebrow">Settlement</div><h2>平台结算与对账</h2>' +
      '<p>' + monthLabel(ctx) + ' · 账单实际值 vs 按订单重算 · 差异逐笔说明</p></div></div>';

    html += '<div class="grid grid-12"><div class="card kpi span-3"><div class="kpi-label">账单 GMV</div><div class="kpi-value">' + UI.wan(sum.gmv) + '</div><div class="kpi-foot">退款 ' + UI.money(sum.refund) + '</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">结算金额</div><div class="kpi-value">' + UI.wan(sum.settledAmount) + '</div><div class="kpi-foot">佣金 + 服务费 ' + UI.money(sum.commission + sum.techFee) + '</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">差异</div><div class="kpi-value">' + diffBills.length + '<span class="unit">笔</span></div><div class="kpi-foot">金额 ' + UI.money2(sum.diff) + ' · 均已有说明</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">待结算</div><div class="kpi-value">' + UI.wan(pendingAmt) + '</div><div class="kpi-foot">' + pending.length + ' 张账单 · 账期占款 ' + UI.wan(model.cash.total.occupied) + '</div></div></div>';

    html += '<div class="card" style="margin-top:14px"><div class="panel-head"><h3>账单明细</h3><span class="sub">点击行查看账单构成</span></div><div class="panel-body flush">' +
      UI.table({
        rowAttrs: function (r) { return 'class="clickable" data-drill="bill" data-id="' + r.bill_id + '"'; },
        columns: [
          { key: 'store_name', label: '店铺', render: function (r) { return '<span class="name">' + UI.esc(r.store_name) + '</span><span class="sub">' + r.bill_id + '</span>'; } },
          { key: 'period', label: '账期' },
          { key: 'gmv', label: '账单 GMV', num: true, render: function (r) { return UI.money(r.gmv); } },
          { key: 'refund', label: '退款', num: true, render: function (r) { return UI.money(r.refund); } },
          { key: 'commission', label: '佣金', num: true, render: function (r) { return UI.money(r.commission); } },
          { key: 'techFee', label: '软件服务费', num: true, render: function (r) { return UI.money(r.techFee); } },
          { key: 'paymentFee', label: '支付手续费', num: true, render: function (r) { return UI.money(r.paymentFee); } },
          { key: 'promotion', label: '推广', num: true, render: function (r) { return UI.money(r.promotion); } },
          { key: 'insurance', label: '运费险', num: true, render: function (r) { return UI.money(r.insurance); } },
          { key: 'settledAmount', label: '结算金额', num: true, render: function (r) { return '<b>' + UI.money2(r.settledAmount) + '</b>'; } },
          { key: 'recomputed', label: '重算', num: true, render: function (r) { return UI.money2(r.recomputed); } },
          { key: 'diff', label: '差异', num: true, render: function (r) { return '<span class="' + (Math.abs(r.diff) > 0.01 ? 'neg' : 'muted') + '">' + UI.money2(r.diff) + '</span>'; } },
          { key: 'status', label: '状态', render: function (r) { return r.status === 'settled' ? UI.badge('已结算', 'ok') : UI.badge('待结算', 'warn'); } }
        ],
        rows: bills
      }) + '</div></div>';

    html += '<div class="grid grid-12" style="margin-top:14px">';
    html += '<div class="card span-7"><div class="panel-head"><h3>差异清单</h3><span class="sub">账单与订单 / 重算的差异及原因</span></div><div class="panel-body">';
    if (diffBills.length) {
      html += diffBills.map(function (b) {
        var parts = [];
        if (Math.abs(b.gmvDiff) > 0.01) parts.push('账单 GMV 与订单差 ' + UI.money2(b.gmvDiff));
        if (Math.abs(b.refundDiff) > 0.01) parts.push('退款差 ' + UI.money2(b.refundDiff));
        if (Math.abs(b.diff) > 0.01) parts.push('结算差 ' + UI.money2(b.diff));
        return '<div style="padding:10px 0;border-bottom:1px dashed var(--line)"><div style="display:flex;justify-content:space-between;gap:10px">' +
          '<b style="font-size:12.5px">' + UI.esc(b.store_name) + ' · ' + b.period + '</b>' + UI.badge('已说明', 'ok') + '</div>' +
          '<div class="hint" style="margin-top:3px">' + parts.join('；') + '</div>' +
          '<div class="hint" style="margin-top:3px;color:var(--ink-2)">原因：' + UI.esc(b.note || '—') + '</div></div>';
      }).join('');

  // ================= 物流成本 =================
  Views.logistics = function (ctx) {
    var data = ctx.state.data, model = ctx.model;
    var orderMap = {};
    data.orders.forEach(function (o) { orderMap[o.id] = o; });
    var rows = data.shipments.filter(function (s) {
      var o = orderMap[s.order_id];
      if (!o) return false;
      if (ctx.store !== 'all' && o.store_id !== ctx.store) return false;
      var m = (s.shipped_at || o.ship_date || o.order_date || '').slice(0, 7);
      return ctx.month === 'all' || m === ctx.month;
    });
    var fee = function (s) { return Number(s.base_fee || 0) + Number(s.overweight_fee || 0) + Number(s.surcharge || 0) + Number(s.return_fee || 0); };
    var totalFee = rows.reduce(function (a, s) { return a + fee(s); }, 0);
    var totalCount = rows.length;
    var returnFee = rows.reduce(function (a, s) { return a + Number(s.return_fee || 0); }, 0);
    var weight = rows.reduce(function (a, s) { return a + Number(s.weight_kg || 0); }, 0);

    var byCarrier = {};
    rows.forEach(function (s) {
      var key = s.carrier || '未填';
      var b = byCarrier[key] || (byCarrier[key] = { name: key, count: 0, fee: 0, returnFee: 0 });
      b.count++; b.fee += fee(s); b.returnFee += Number(s.return_fee || 0);
    });
    var carriers = Object.keys(byCarrier).map(function (k) { return byCarrier[k]; }).sort(function (a, b) { return b.fee - a.fee; });
    var byProvince = {};
    rows.forEach(function (s) {
      var key = s.province || '未填';
      var b = byProvince[key] || (byProvince[key] = { name: key, count: 0, fee: 0 });
      b.count++; b.fee += fee(s);
    });
    var provinces = Object.keys(byProvince).map(function (k) { return byProvince[k]; }).sort(function (a, b) { return b.fee - a.fee; });

    var html = '<div class="page-head"><div><div class="eyebrow">Logistics</div><h2>物流成本</h2>' +
      '<p>' + monthLabel(ctx) + ' · ' + scopeName(ctx) + ' · 按实际面单归集：首重 + 续重 + 区域加价 + 退回运费</p></div></div>';

    html += '<div class="grid grid-12">' +
      '<div class="card kpi span-3"><div class="kpi-label">物流总成本</div><div class="kpi-value">' + UI.wan(totalFee) + '</div><div class="kpi-foot">' + UI.num(totalCount) + ' 张面单</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">单均运费</div><div class="kpi-value">' + UI.money2(totalCount ? totalFee / totalCount : 0) + '</div><div class="kpi-foot">平均重量 ' + (totalCount ? (weight / totalCount).toFixed(2) : '0') + ' kg</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">退回运费</div><div class="kpi-value">' + UI.wan(returnFee) + '</div><div class="kpi-foot">占物流成本 ' + UI.pct(totalFee ? returnFee / totalFee * 100 : 0) + '</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">物流费率</div><div class="kpi-value">' + UI.pct(model.total.revenue ? (ctx.month === 'all' ? totalFee / model.total.revenue * 100 : totalFee / (ctx.month ? model.companyMonth[ctx.month].revenue : 1) * 100) : 0) + '</div><div class="kpi-foot">占营业收入</div></div></div>';

    html += '<div class="grid grid-12" style="margin-top:14px"><div class="card span-6"><div class="panel-head"><h3>承运商成本</h3><span class="sub">按运费</span></div><div class="panel-body flush">' +
      UI.table({
        columns: [
          { key: 'name', label: '承运商' },
          { key: 'count', label: '面单', num: true },
          { key: 'fee', label: '运费', num: true, render: function (r) { return UI.money2(r.fee); } },
          { key: 'avg', label: '单均', num: true, render: function (r) { return UI.money2(r.count ? r.fee / r.count : 0); } },
          { key: 'share', label: '占比', num: true, render: function (r) { return UI.pct(totalFee ? r.fee / totalFee * 100 : 0); } }
        ],
        rows: carriers,
        footer: [{ html: '<b>合计</b>' }, { html: '<b>' + UI.num(totalCount) + '</b>', num: true },
          { html: '<b>' + UI.money2(totalFee) + '</b>', num: true }, { html: UI.money2(totalCount ? totalFee / totalCount : 0), num: true }, { html: '100%', num: true }]
      }) + '</div></div>' +
      '<div class="card span-6"><div class="panel-head"><h3>省份分布 Top 12</h3><span class="sub">看偏远地区加价影响</span></div><div class="panel-body flush">' +
      UI.table({
        columns: [
          { key: 'name', label: '省份' }, { key: 'count', label: '面单', num: true },
          { key: 'fee', label: '运费', num: true, render: function (r) { return UI.money2(r.fee); } },
          { key: 'avg', label: '单均', num: true, render: function (r) { return UI.money2(r.count ? r.fee / r.count : 0); } }
        ],
        rows: provinces.slice(0, 12)
      }) + '</div></div></div>';

    html += '<div class="card" style="margin-top:14px"><div class="panel-head"><h3>各店物流成本</h3><span class="sub">含单均与费率</span></div><div class="panel-body flush">' +
      UI.table({
        columns: [
          { key: 'name', label: '店铺' },
          { key: 'count', label: '面单', num: true },
          { key: 'fee', label: '物流成本', num: true, render: function (r) { return UI.money2(r.fee); } },
          { key: 'avg', label: '单均', num: true, render: function (r) { return UI.money2(r.count ? r.fee / r.count : 0); } },
          { key: 'revenue', label: '营业收入', num: true, render: function (r) { return UI.money(r.revenue); } },
          { key: 'rate', label: '物流费率', num: true, render: function (r) { return UI.pct(r.revenue ? r.fee / r.revenue * 100 : 0); } }
        ],
        rows: ctx.storeRows().map(function (s) {
          var b = rows.filter(function (x) { return orderMap[x.order_id] && orderMap[x.order_id].store_id === s.store_id; });
          return { name: s.name, count: b.length, fee: b.reduce(function (a, x) { return a + fee(x); }, 0), revenue: s.revenue };
        })
      }) + '</div></div>';

    ctx.setExport('物流成本-' + (ctx.month === 'all' ? '全部' : ctx.month) + '.csv',
      ['承运商', '面单数', '运费', '退回运费', '单均'], carriers.map(function (r) { return [r.name, r.count, r.fee.toFixed(2), r.returnFee.toFixed(2), (r.count ? r.fee / r.count : 0).toFixed(2)]; }));

  // ================= 工资与提成 =================
  Views.payroll = function (ctx) {
    var model = ctx.model, month = ctx.month;
    var rows = [];
    if (month === 'all') {
      var agg = {};
      model.months.forEach(function (m) {
        model.payroll.byMonth[m].rows.forEach(function (r) {
          var a = agg[r.employee_id] || (agg[r.employee_id] = {
            employee_id: r.employee_id, name: r.name, role: r.role, month: '3 个月合计',
            base_salary: 0, allowance: 0, commission: 0, deduction: 0, gross: 0, net: 0, store_ids: r.store_ids
          });
          a.base_salary += r.base_salary; a.allowance += r.allowance; a.commission += r.commission;
          a.deduction += r.deduction; a.gross += r.gross; a.net += r.net;
        });
      });
      rows = Object.keys(agg).map(function (k) { return agg[k]; });
    } else {
      rows = model.payroll.byMonth[month].rows.slice();
    }
    rows.sort(function (a, b) { return b.gross - a.gross; });
    var totals = rows.reduce(function (a, r) { a.gross += r.gross; a.net += r.net; a.commission += r.commission; a.base += r.base_salary; return a; }, { gross: 0, net: 0, commission: 0, base: 0 });

    var html = '<div class="page-head"><div><div class="eyebrow">Payroll</div><h2>工资与提成</h2>' +
      '<p>' + monthLabel(ctx) + ' · ' + rows.length + ' 人 · 提成按店铺' + (model.payroll.settings.basis === 'revenue' ? '净销售额' : '贡献毛利') + '阶梯计算</p></div></div>';

    html += '<div class="grid grid-12">' +
      '<div class="card kpi span-3"><div class="kpi-label">应发工资</div><div class="kpi-value">' + UI.wan(totals.gross) + '</div><div class="kpi-foot">占营业收入 ' + UI.pct(model.total.revenue ? totals.gross / (month === 'all' ? model.total.revenue : model.companyMonth[month].revenue) * 100 : 0) + '</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">实发工资</div><div class="kpi-value">' + UI.wan(totals.net) + '</div><div class="kpi-foot">代扣 ' + UI.money(totals.gross - totals.net) + '</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">提成支出</div><div class="kpi-value">' + UI.wan(totals.commission) + '</div><div class="kpi-foot">占应发 ' + UI.pct(totals.gross ? totals.commission / totals.gross * 100 : 0) + '</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">人均应发</div><div class="kpi-value">' + UI.money(rows.length ? totals.gross / rows.length : 0) + '</div><div class="kpi-foot">' + (month === 'all' ? '3 个月合计' : '本月') + ' · 含提成</div></div></div>';

    html += '<div class="grid grid-12" style="margin-top:14px"><div class="card span-8"><div class="panel-head"><h3>工资表</h3><span class="sub">' + (month === 'all' ? '全部账期合计' : monthLabel(ctx)) + ' · 点击行看月度明细</span></div><div class="panel-body flush">' +
      UI.table({
        rowAttrs: function (r) { return 'class="clickable" data-drill="employee" data-id="' + r.employee_id + '"'; },
        columns: [
          { key: 'name', label: '员工', render: function (r) { return '<span class="name">' + UI.esc(r.name) + '</span><span class="sub">' + UI.esc(r.role) + '</span>'; } },
          { key: 'store_ids', label: '负责店铺', render: function (r) { return r.store_ids && r.store_ids.length ? UI.esc(r.store_ids.map(function (id) { return storeName(ctx, id); }).join('、')) : '<span class="muted">公共（按收入分摊）</span>'; } },
          { key: 'base_salary', label: '底薪', num: true, render: function (r) { return UI.money(r.base_salary); } },
          { key: 'allowance', label: '补贴', num: true, render: function (r) { return UI.money(r.allowance); } },
          { key: 'commission', label: '提成', num: true, render: function (r) { return UI.money(r.commission); } },
          { key: 'deduction', label: '代扣', num: true, render: function (r) { return UI.money(r.deduction); } },
          { key: 'gross', label: '应发', num: true, render: function (r) { return '<b>' + UI.money(r.gross) + '</b>'; } },
          { key: 'net', label: '实发', num: true, render: function (r) { return UI.money(r.net); } }
        ],
        rows: rows,
        footer: [{ html: '<b>合计</b>' }, { html: '' }, { html: UI.money(totals.base), num: true }, { html: '', num: true },
          { html: UI.money(totals.commission), num: true }, { html: UI.money(totals.gross - totals.net), num: true },
          { html: '<b>' + UI.money(totals.gross) + '</b>', num: true }, { html: '<b>' + UI.money(totals.net) + '</b>', num: true }]
      }) + '</div></div>';

    html += '<div class="card span-4"><div class="panel-head"><h3>提成规则</h3><span class="sub">可在设置中修改</span></div><div class="panel-body">' +

        return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px"><span>' + range + '</span><b>' + (Number(b.rate) * 100).toFixed(1) + '%</b></div>';

      '<button class="btn small" data-action="go" data-page="settings" style="margin-top:10px">去修改规则</button></div></div></div>';

    ctx.setExport('工资表-' + (month === 'all' ? '全部' : month) + '.csv',
      ['员工', '岗位', '负责店铺', '底薪', '补贴', '提成', '代扣', '应发', '实发'],
      rows.map(function (r) {
        return [r.name, r.role, (r.store_ids || []).map(function (id) { return storeName(ctx, id); }).join('、'), r.base_salary, r.allowance, r.commission, r.deduction, r.gross, r.net];
      }));
    return { html: html };
  };

    expenses.forEach(function (e) {
      var k = e.category || '其他';
      byCat[k] = (byCat[k] || 0) + Number(e.amount || 0);
    });
    var catRows = Object.keys(byCat).map(function (k) { return { category: k, amount: byCat[k], share: expTotal ? byCat[k] / expTotal * 100 : 0 }; }).sort(function (a, b) { return b.amount - a.amount; });

    var input = inv.input, output = inv.output;
    var html = '<div class="page-head"><div><div class="eyebrow">Expenses & Invoices</div><h2>费用与发票</h2>' +
      '<p>' + monthLabel(ctx) + ' · 进项 ' + input.count + ' 张 / 销项 ' + output.count + ' 张 · 未匹配 ' + (input.unmatched + output.unmatched) + ' 张</p></div></div>';

    html += '<div class="grid grid-12">' +
      '<div class="card kpi span-3"><div class="kpi-label">进项发票</div><div class="kpi-value">' + UI.wan(input.amount) + '</div><div class="kpi-foot">税额 ' + UI.money(input.tax) + ' · 已匹配 ' + input.matched + ' 张</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">销项发票</div><div class="kpi-value">' + UI.wan(output.amount) + '</div><div class="kpi-foot">税额 ' + UI.money(output.tax) + ' · 已匹配 ' + output.matched + ' 张</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">发票差异</div><div class="kpi-value">' + (input.mismatch + output.mismatch) + '<span class="unit">张</span></div><div class="kpi-foot">未匹配 ' + (input.unmatched + output.unmatched) + ' 张</div></div>' +
      '<div class="card kpi span-3"><div class="kpi-label">缺失发票</div><div class="kpi-value">' + UI.wan(inv.missingAmount) + '</div><div class="kpi-foot">采购 ' + inv.missing.purchases.length + ' 笔 · 费用 ' + inv.missing.expenses.length + ' 笔</div></div></div>';

    html += '<div class="grid grid-12" style="margin-top:14px"><div class="card span-5"><div class="panel-head"><h3>费用结构</h3><span class="sub">' + monthLabel(ctx) + ' · 合计 ' + UI.money(expTotal) + '</span></div><div class="panel-body flush">' +
      UI.table({
        columns: [
          { key: 'category', label: '类别' },
          { key: 'amount', label: '金额', num: true, render: function (r) { return UI.money2(r.amount); } },
          { key: 'share', label: '占比', num: true, render: function (r) { return UI.pct(r.share); } }
        ],
        rows: catRows,
        footer: [{ html: '<b>合计</b>' }, { html: '<b>' + UI.money2(expTotal) + '</b>', num: true }, { html: '100%', num: true }]
      }) + '</div></div>' +
      '<div class="card span-7"><div class="panel-head"><h3>发票异常</h3><span class="sub">数量不符、未匹配、重复与缺失</span></div><div class="panel-body">';
    var issues = [];
    inv.issues.forEach(function (x) { issues.push({ level: 'bad', title: '发票 ' + (x.invoice || ''), detail: x.message }); });
    inv.missing.purchases.forEach(function (p) { issues.push({ level: 'warn', title: '采购单 ' + p.po_id + ' 缺少发票', detail: '金额 ' + UI.money2(p.amount) + ' · ' + p.date }); });
    inv.missing.expenses.forEach(function (e) { issues.push({ level: 'warn', title: (e.category || '') + ' ' + e.expense_id + ' 缺少发票', detail: '金额 ' + UI.money2(e.amount) + ' · ' + (e.vendor || '') }); });
    if (!issues.length) html += '<div class="callout">' + UI.icon('check') + '<span>发票全部匹配，没有缺失。</span></div>';
    else {
      html += '<div class="alert-list">' + issues.slice(0, 10).map(function (x) {
        return '<div class="alert-item ' + (x.level === 'bad' ? 'error' : 'warn') + '"><span class="icon">!</span><div><div class="t">' + UI.esc(x.title) + '</div><div class="d">' + UI.esc(x.detail) + '</div></div></div>';
      }).join('') + '</div>';
      if (issues.length > 10) html += '<p class="hint" style="margin-top:8px">另有 ' + (issues.length - 10) + ' 条，见导入后的错误清单或发票台账导出。</p>';
    }
    html += '</div></div></div>';

    html += '<div class="grid grid-12" style="margin-top:14px"><div class="card span-6"><div class="panel-head"><h3>进项发票</h3><span class="sub">采购 / 费用 / 平台服务费</span></div><div class="panel-body flush">' +
      invoiceTable(input.list, true) + '</div></div>' +
      '<div class="card span-6"><div class="panel-head"><h3>销项发票</h3><span class="sub">平台销售汇总</span></div><div class="panel-body flush">' +
      invoiceTable(output.list, false) + '</div></div></div>';

    ctx.setExport('发票台账-' + (ctx.month === 'all' ? '全部' : ctx.month) + '.csv',
      ['记录号', '方向', '发票号', '日期', '销方', '购方', '价税合计', '税额', '关联类型', '关联单据', '匹配状态'],
      input.list.concat(output.list).map(function (x) {
        return [x.id, x.direction === 'output' ? '销项' : '进项', x.number, x.date, x.seller, x.buyer, x.amount, x.tax_amount, x.related_type, x.related_id, x.status];
      }));
    return { html: html };
  };

  function invoiceTable(list, input) {
    if (!list.length) return '<div class="empty">暂无发票</div>';
    var note = list.length > 30 ? '<p class="hint" style="padding:8px 12px">共 ' + list.length + ' 张，页面显示前 30 张；导出 CSV 可看全部。</p>' : '';
    return UI.table({
      rowAttrs: function (r) { return 'class="clickable" data-drill="invoice" data-id="' + r.id + '"'; },
      columns: [
        { key: 'number', label: '发票号', render: function (r) { return '<span class="mono">' + UI.esc(r.number || r.id) + '</span><span class="sub">' + r.date + '</span>'; } },
        { key: 'party', label: input ? '销方' : '购方', render: function (r) { return UI.esc(input ? r.seller : r.buyer); } },
        { key: 'amount', label: '价税合计', num: true, render: function (r) { return UI.money2(r.amount); } },
        { key: 'tax_amount', label: '税额', num: true, render: function (r) { return UI.money2(r.tax_amount); } },
        { key: 'status', label: '匹配', render: function (r) { return r.status === 'matched' ? UI.badge('已匹配', 'ok') : r.status === 'mismatch' ? UI.badge('金额差异', 'warn') : UI.badge('未匹配', 'bad'); } }
      ],
      rows: list.slice(0, 30)
    }) + note;
  }

  root.Views = Views;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 应用外壳：状态、路由、总览、导入、设置、口径、下钻 */
(function (root) {
  'use strict';

  var UI = root.UI, Charts = root.Charts, Engine = root.FinEngine;
  var SETTINGS_KEY = 'fin_settings_v1';

  var PAGE_META = {
    overview: { title: '经营总览', sub: '老板视角的一页纸：利润、店铺、现金、成本、库存' },
    stores: { title: '店铺利润', sub: '每个店铺 / 平台的收入、成本与利润贡献' },
    products: { title: '商品利润', sub: '按 SKU 核算销量、成本、毛利与库存占用' },
    settlement: { title: '平台结算与对账', sub: '账单 vs 订单 vs 打款，差异逐笔说明' },
    logistics: { title: '物流成本', sub: '面单费用、单均运费、区域与退回成本' },
    inventory: { title: '采购与库存', sub: '移动加权平均成本、库存金额与周转、滞销' },
    payroll: { title: '工资与提成', sub: '底薪 + 阶梯提成，按人 / 按店铺核算' },
    invoices: { title: '费用与发票', sub: '费用结构、进项 / 销项台账与匹配差异' },
    import: { title: '数据导入', sub: '把平台、物流、ERP、采购、工资、发票数据接进来' },
    settings: { title: '设置', sub: '店铺费率、提成阶梯与核算参数' },
    formulas: { title: '口径与说明', sub: '每个指标怎么算、数据从哪来、校验规则' }
  };
  var NAV = [
    { group: '经营分析', items: [['overview', '经营总览', 'overview'], ['stores', '店铺利润', 'stores'], ['products', '商品利润', 'products']] },
    { group: '资金与成本', items: [['settlement', '平台结算', 'settlement'], ['logistics', '物流成本', 'logistics'], ['inventory', '采购与库存', 'inventory']] },
    { group: '人效与票据', items: [['payroll', '工资与提成', 'payroll'], ['invoices', '费用与发票', 'invoices']] },
    { group: '系统', items: [['import', '数据导入', 'import'], ['settings', '设置', 'settings'], ['formulas', '口径与说明', 'info']] }
  ];
  var FORMULA_LABELS = {
    revenue: '营业收入', gmv: 'GMV', refund: '退款', cogs: '商品成本', freight: '物流成本',
    platformFees: '平台费用', commission: '佣金', promotion: '推广费', labor: '人工成本',
    other: '其他费用', grossProfit: '经营毛利', contribution: '贡献毛利', netProfit: '净利润',
    netMargin: '净利率', aov: '客单价', refundRate: '退款率', turnoverDays: '周转天数',
    cashReceived: '已回款', cashPending: '待结算', cashOccupied: '账期占款', invoice: '发票匹配'
  };

  var state = {
    data: null, model: null, page: 'overview', month: 'all', store: 'all',
    sort: {}, imported: false, import: null, lastExport: null, booted: false
  };

  function uid() { return Math.random().toString(36).slice(2, 8); }

  function applySavedSettings(data) {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return data;
      var saved = JSON.parse(raw);
      if (saved.settings) {
        if (saved.settings.commission_ladder) data.settings.commission_ladder = saved.settings.commission_ladder;
        if (saved.settings.slow_moving_days) data.settings.slow_moving_days = saved.settings.slow_moving_days;
        if (saved.settings.default_basis) data.settings.default_basis = saved.settings.default_basis;
      }
      if (saved.stores) {
        data.stores.forEach(function (s) {
          if (saved.stores[s.id]) Object.assign(s, saved.stores[s.id]);
        });
      }
    } catch (e) { /* 忽略损坏的本地设置 */ }
    return data;
  }

  function compute() {
    state.model = Engine.computeModel(state.data);
  }

  function currentScope() {
    return scopeFor(state.month, state.store);
  }

  var SCOPE_FIELDS = ['gmv', 'refund', 'netSales', 'subsidy', 'revenue', 'cogs', 'freight', 'commission', 'techFee', 'paymentFee', 'insurance', 'platformFees', 'promotion', 'labor', 'other', 'grossProfit', 'contribution', 'netProfit', 'orders', 'units', 'shipCount'];

  function scopeFor(month, storeId) {
    var m = state.model;
    if (!storeId || storeId === 'all') return month === 'all' ? m.total : m.companyMonth[month];
    if (month !== 'all') return m.storeMonth[storeId][month];
    var acc = { month: 'all', store_id: storeId };
    SCOPE_FIELDS.forEach(function (k) { acc[k] = 0; });
    m.months.forEach(function (mm) {
      SCOPE_FIELDS.forEach(function (k) { acc[k] += Number(m.storeMonth[storeId][mm][k] || 0); });
    });
    acc.netSales = acc.revenue - acc.subsidy;
    acc.grossProfit = acc.revenue - acc.cogs;
    acc.contribution = acc.grossProfit - acc.freight;
    acc.aov = acc.orders ? acc.gmv / acc.orders : 0;
    acc.refundRate = acc.gmv ? acc.refund / acc.gmv * 100 : 0;
    acc.netMargin = acc.revenue ? acc.netProfit / acc.revenue * 100 : 0;
    return acc;
  }

  // ---------------- 导航 / 顶栏 ----------------
  function renderSidebar() {
    var html = '<div class="brand"><div class="brand-mark">麓</div><div><div class="brand-name">麓野 · 财务中枢</div>' +
      '<div class="brand-sub">FINANCE CONSOLE</div><span class="demo-pill">DEMO 演示数据</span></div></div>';
    html += '<nav class="nav">';
    NAV.forEach(function (g) {
      html += '<div class="nav-group">' + g.group + '</div>';
      g.items.forEach(function (it) {
        html += '<button class="nav-item" data-page="' + it[0] + '">' + UI.icon(it[2]) + '<span>' + it[1] + '</span></button>';
      });
    });
    html += '</nav>';
    html += '<div class="sidebar-foot">数据截止 ' + state.model.months[state.model.months.length - 1] + '-31<br>' +
      '演示品牌与店铺均为虚构<br>单角色 · 仅老板视图</div>';
    document.getElementById('sidebar').innerHTML = html;
  }

  function renderTopbar() {
    var meta = PAGE_META[state.page];
    var showFilter = ['import', 'settings', 'formulas'].indexOf(state.page) < 0;
    var showStore = ['overview', 'stores', 'products', 'settlement', 'logistics'].indexOf(state.page) >= 0;
    var scopeText = UI.fullMonth(state.month) + (state.store === 'all' ? ' · 全部店铺' : ' · ' + storeName(state.store));
    var html = '<div class="topbar-title"><h1>老板视图</h1><p>数据截止 ' + state.model.months[state.model.months.length - 1] + '-31 · ' + UI.esc(scopeText) + ' · 演示数据</p></div>';
    html += '<div class="topbar-actions">';
    if (showFilter) {
      html += '<div class="chips" role="group" aria-label="账期">';
      html += '<button class="chip' + (state.month === 'all' ? ' active' : '') + '" data-month="all">全部</button>';
      state.model.months.forEach(function (m) {
        html += '<button class="chip' + (state.month === m ? ' active' : '') + '" data-month="' + m + '">' + Number(m.slice(5, 7)) + '月</button>';
      });
      html += '</div>';
    }
    if (showStore) {
      html += '<select class="select" id="store-filter" aria-label="店铺">';
      html += '<option value="all"' + (state.store === 'all' ? ' selected' : '') + '>全部店铺</option>';
      state.model.stores.forEach(function (s) {
        html += '<option value="' + s.id + '"' + (state.store === s.id ? ' selected' : '') + '>' + UI.esc(s.name) + '</option>';
      });
      html += '</select>';
    }
    html += '<button class="btn" data-action="print">' + UI.icon('print') + '打印</button>';
    html += '<button class="btn" data-action="export">' + UI.icon('download') + '导出 CSV</button>';
    html += '<button class="btn primary" data-action="go" data-page="import">' + UI.icon('import') + '导入数据</button>';
    html += '</div>';
    document.getElementById('topbar').innerHTML = html;
  }

  function setNavActive() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (el) {
      el.classList.toggle('active', el.getAttribute('data-page') === state.page);
    });
  }

  // ---------------- 页面上下文 ----------------
  function makeCtx() {
    var ctx = {
      state: state, model: state.model, month: state.month, store: state.store,
      months: state.model.months, fmt: UI, charts: Charts,
      sort: state.sort[state.page] || {},
      isAll: state.month === 'all'
    };
    ctx.setExport = function (name, headers, rows) { ctx.export = { name: name, headers: headers, rows: rows }; };
    ctx.scope = currentScope;
    ctx.scopeLabel = UI.fullMonth(state.month) + (state.store === 'all' ? '' : ' · ' + storeName(state.store));
    ctx.storeRows = function () {
      return state.model.stores.map(function (s) {
        if (state.month === 'all') return Object.assign({}, state.model.storeTotal[s.id], { name: s.name, platform: s.platform });
        var sm = state.model.storeMonth[s.id][state.month];
        return Object.assign({}, sm, { name: s.name });
      }).sort(function (a, b) { return b.netProfit - a.netProfit; });
    };
    return ctx;
  }

  function storeName(id) {
    var s = state.model.stores.filter(function (x) { return x.id === id; })[0];
    return s ? s.name : id;
  }

  function scopeStores() {
    var model = state.model;
    return model.stores.filter(function (s) { return state.store === 'all' || s.id === state.store; });
  }

  function render() {
    if (!state.model) return;
    renderTopbar();
    setNavActive();
    var ctx = makeCtx();
    var result;
    try {
      if (state.page === 'overview') result = renderOverview(ctx);
      else if (state.page === 'import') result = renderImport(ctx);
      else if (state.page === 'settings') result = renderSettings(ctx);
      else if (state.page === 'formulas') result = renderFormulas(ctx);
      else if (root.Views && root.Views[state.page]) result = root.Views[state.page](ctx);
      else result = { html: '<div class="empty">页面不存在</div>' };
    } catch (e) {
      result = { html: '<div class="card pad"><h3>页面渲染出错</h3><p class="muted">' + UI.esc(e.message) + '</p></div>' };
      console.error(e);
    }
    document.getElementById('view').innerHTML = result.html;
    state.lastExport = result.export || ctx.export || null;
    window.scrollTo(0, 0);
  }

  function go(page) {
    if (!PAGE_META[page]) return;
    state.page = page;
    if (location.hash !== '#/' + page) location.hash = '#/' + page;
    else render();
  }

  // ---------------- 总览 ----------------
  function renderOverview(ctx) {
    var m = state.model, month = state.month;
    var scope = scopeFor(month, state.store);
    var prev = null;
    if (month !== 'all') {
      var idx = m.months.indexOf(month);
      if (idx > 0) prev = state.store === 'all' ? m.companyMonth[m.months[idx - 1]] : m.storeMonth[state.store][m.months[idx - 1]];
    }
    var curNet = scope.netProfit;
    var d = (month !== 'all' && prev) ? UI.delta(curNet, prev.netProfit) : null;

    var inv = month === 'all' ? m.inventory.summary : m.inventory.monthly[month];
    var invValue = month === 'all' ? m.inventory.summary.value : inv.closingValue;
    var turnover = month === 'all' ? m.inventory.summary.turnoverDays : inv.turnoverDays;
    var slowValue = m.inventory.summary.slowMovingValue;

    var stores = ctx.storeRows();
    var rankBase = month === 'all' ? m.total.netProfit : m.companyMonth[month].netProfit;
    var rankMax = Math.max.apply(null, stores.map(function (s) { return Math.abs(s.netProfit); }).concat([1]));
    var costItems = [
      { label: '商品成本', value: scope.cogs, color: 'var(--chart-1)' },
      { label: '物流', value: scope.freight, color: 'var(--chart-2)' },
      { label: '平台费用', value: scope.platformFees, color: 'var(--chart-3)' },
      { label: '推广', value: scope.promotion, color: 'var(--chart-4)' },
      { label: '人工', value: scope.labor, color: 'var(--chart-5)' },
      { label: '其他', value: scope.other, color: 'var(--chart-8)' }
    ];

    // 现金流是时点口径：始终显示截至数据截止日的累计回款与当前未结算金额
    var cash = state.store === 'all' ? m.cash.total : m.cash.byStore[state.store];

    var html = '';
    html += '<div class="print-head"><span class="brandline">麓野 · 财务中枢</span><span>经营总览 · ' + ctx.scopeLabel + '</span><span>数据截止 ' + m.months[m.months.length - 1] + '-31</span></div>';
    html += '<div class="page-head"><div><div class="eyebrow">Overview</div><h2>经营总览</h2>' +
      '<p>' + UI.esc(ctx.scopeLabel) + ' · 营业收入 ' + UI.wan(scope.revenue) + ' · 订单 ' + UI.num(scope.orders) + ' 笔</p></div>' +
      '<div class="head-actions"><button class="btn" data-action="go" data-page="formulas">' + UI.icon('info') + '口径说明</button>' +
      '<button class="btn" data-action="go" data-page="import">' + UI.icon('import') + '导入真实数据</button></div></div>';

    // KPI 五张卡
    html += '<div class="kpi-grid">';

    html += '<div class="card kpi"><div class="kpi-label" title="净利润 = 营业收入 − 商品成本 − 物流 − 平台费用 − 推广费 − 人工 − 其他费用；净利率 = 净利润 ÷ 营业收入">净利润 <span class="muted">/ 净利率</span></div>' +
      '<div class="kpi-value">' + UI.wan(curNet) + '<span class="unit">元</span></div>' +
      '<div class="kpi-sub">' + (month === 'all'
        ? '<span class="muted">近 ' + m.months.length + ' 个月累计</span>'
        : '<span class="delta ' + (d ? d.cls : 'flat') + '">' + (d ? d.text : '—') + '</span><span>环比</span>') +
      '<span class="badge ok">净利率 ' + UI.pct(scope.netMargin) + '</span></div>' +
      '<div class="kpi-spark">' + Charts.sparkline({
        values: m.months.map(function (x) { return state.store === 'all' ? m.companyMonth[x].netProfit : m.storeMonth[state.store][x].netProfit; }),
        width: 250, height: 36, color: 'var(--chart-4)'
      }) + '</div>' +
      '<div class="kpi-foot">营业收入 ' + UI.money(scope.revenue) + ' · 贡献毛利 ' + UI.money(scope.contribution) + '</div></div>';

    html += '<div class="card kpi"><div class="kpi-label" title="按店铺净利润排名；贡献占比 = 店铺净利润 ÷ 公司净利润">店铺利润排名 <span class="muted">/ 贡献占比</span></div>' +
      '<div class="kpi-mini-list">' + stores.slice(0, 3).map(function (s) {
        var share = rankBase ? Math.round(s.netProfit / rankBase * 1000) / 10 : 0;
        return '<div class="kpi-mini-row"><span class="nowrap">' + UI.esc(s.name.replace(/（.*?）/, '')) + '</span>' +
          '<span class="mono">' + UI.wan(s.netProfit) + ' · ' + share + '%</span>' +
          '<span class="track"><i style="width:' + Math.max(2, Math.min(100, Math.abs(s.netProfit) / rankMax * 100)) + '%"></i></span></div>';
      }).join('') + '</div>' +

  function renderImportResult(imp) {
    var r = imp.result;
    var table = root.FinTemplates.getTable(imp.tableId);

    var html = '<div class="import-result"><div class="head">' + okBadge + '<h4>' + UI.esc(table.label) + '</h4>' +
      '<span class="muted tiny">' + UI.esc(imp.fileName) + '</span>' +

      '<div><div class="k">读取行数</div><div class="v">' + UI.num(r.stats.rows) + '</div></div>' +

      '<div><div class="k">将写入记录</div><div class="v">' + UI.num(r.stats.outputRows) + '</div></div>' +
      '<div><div class="k">错误</div><div class="v" style="color:' + (r.errorCount ? 'var(--red)' : 'var(--jade)') + '">' + r.errorCount + '</div></div>' +
      '<div><div class="k">警告</div><div class="v">' + (r.warningCount || 0) + '</div></div>' +
      '</div>';

    var mapped = [];
    Object.keys(r.mapping || {}).forEach(function (i) {
      var key = r.mapping[i];
      var fld = table.fields.filter(function (f) { return f.key === key; })[0];
      mapped.push('<span class="badge neutral">' + UI.esc(r.headers[i]) + ' → ' + UI.esc(fld ? fld.label : key) + '</span>');
    });
    html += '<div style="margin-top:12px"><div class="k">字段映射</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">' +
      (mapped.join('') || '<span class="muted tiny">没有识别到字段</span>') + '</div>';
    if (r.unmatched && r.unmatched.length) {
      html += '<p class="hint" style="margin-top:6px">未识别列（将忽略）：' + UI.esc(r.unmatched.join('、')) + '</p>';
    }
    html += '</div>';

    if (r.errors && r.errors.length) {
      html += '<div style="margin-top:14px"><div class="k" style="color:var(--red)">错误清单（前 ' + Math.min(20, r.errors.length) + ' 条）</div>' +
        UI.table({
          columns: [
            { key: 'row', label: '行号', num: true, width: '60px' },
            { key: 'field', label: '字段', width: '110px' },
            { key: 'value', label: '原值' },
            { key: 'message', label: '原因' }

          rows: r.errors.slice(0, 20)
        }) + '<button class="btn small" style="margin-top:8px" data-action="export-errors">下载完整错误清单</button></div>';
    }
    if (r.warnings && r.warnings.length) {
      html += '<div style="margin-top:12px"><div class="k">警告（不影响导入）</div><ul class="hint" style="margin:6px 0 0 18px">' +
        r.warnings.slice(0, 5).map(function (w) { return '<li>' + UI.esc(w) + '</li>'; }).join('') + '</ul></div>';
    }

    if (r.preview && r.preview.length) {
      var keys = Object.keys(r.preview[0]).filter(function (k) { return k !== '__row'; }).slice(0, 8);

        columns: keys.map(function (k) { return { key: k, label: k }; }),

      }) + '</div>';
    }

    if (r.ok) {
      html += '<div style="margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +

        '<label class="tiny"><input type="radio" name="import-mode" value="replace"> 替换整表</label>' +
        '<button class="btn primary" data-action="apply-import">确认导入并重算</button></div>';
    } else {
      html += '<p class="hint" style="margin-top:12px">修正错误后重新选择文件即可，当前数据未被修改。</p>';
    }
    html += '</div>';
    return html;
  }

  function importFile(tableId, file) {
    root.FinImporter.readFile(file).then(function (parsed) {
      var result = root.FinImporter.prepare(tableId, parsed, state.data, 'append');
      if (parsed.truncated) result.warnings.unshift('文件超过 20000 行，已截断；请拆分后分批导入');
      state.import = { tableId: tableId, fileName: file.name, result: result, parsed: parsed };
      render();
    }).catch(function (e) {
      UI.toast(e.message || '文件解析失败', 'err');
    });
  }

  function applyImport() {
    var imp = state.import;
    if (!imp || !imp.result || !imp.result.ok) return;
    var modeEl = document.querySelector('input[name="import-mode"]:checked');
    var mode = modeEl ? modeEl.value : 'append';
    var backup = state.data;
    try {
      state.data = root.FinImporter.apply(state.data, imp.result.patch, mode);
      compute();
      state.imported = true;
      state.import = { done: { label: imp.result.label, rows: imp.result.stats.outputRows } };
      UI.toast('导入完成，已重新核算', 'ok');
      render();
    } catch (e) {
      state.data = backup;
      compute();
      UI.toast('导入失败：' + e.message, 'err');
    }
  }

  function saveSettings() {
    var d = state.data;
    d.stores.forEach(function (st) {
      ['commission_rate', 'tech_fee_rate', 'payment_fee_rate', 'insurance_rate', 'settlement_days'].forEach(function (k) {
        var el = document.querySelector('[data-rate="' + st.id + '|' + k + '"]');
        if (!el) return;
        var v = Number(el.value);
        if (!isFinite(v)) return;
        st[k] = k === 'settlement_days' ? Math.round(v) : v / 100;
      });
    });
    var ladder = [];
    Array.prototype.forEach.call(document.querySelectorAll('[data-ladder-row]'), function (row) {
      var min = Number(row.querySelector('[data-ladder="min"]').value) || 0;
      var maxRaw = row.querySelector('[data-ladder="max"]').value;
      var rate = Number(row.querySelector('[data-ladder="rate"]').value);
      if (!isFinite(rate)) return;
      ladder.push({ min: min, max: maxRaw === '' ? null : Number(maxRaw), rate: rate / 100 });
    });
    ladder.sort(function (a, b) { return a.min - b.min; });
    if (ladder.length) d.settings.commission_ladder = ladder;
    var basis = document.getElementById('basis-select');
    if (basis) d.settings.default_basis = basis.value;
    var slow = document.getElementById('slow-days');
    if (slow) d.settings.slow_moving_days = Math.max(1, Math.round(Number(slow.value) || 60));

    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        settings: {
          commission_ladder: d.settings.commission_ladder,
          default_basis: d.settings.default_basis,
          slow_moving_days: d.settings.slow_moving_days
        },
        stores: d.stores.reduce(function (acc, st) {
          acc[st.id] = {
            commission_rate: st.commission_rate, tech_fee_rate: st.tech_fee_rate,
            payment_fee_rate: st.payment_fee_rate, insurance_rate: st.insurance_rate,
            settlement_days: st.settlement_days
          };
          return acc;
        }, {})
      }));
    } catch (e) { /* 本地存储不可用时忽略 */ }
    compute();
    UI.toast('设置已保存，报表已重算', 'ok');
    render();
  }

      return o.store_id === storeId && (state.month === 'all' || o.order_date.slice(0, 7) === state.month);
    }).slice(-10).reverse();
    if (!rows.length) return '';
    return '<div style="margin-top:16px"><div class="panel-head" style="padding:0 0 8px"><h3 style="font-size:13px">最近订单明细（' + rows.length + ' 笔）</h3>' +
      '<span class="sub" style="margin-left:auto">汇总数由这些明细计算</span></div>' + UI.table({
        columns: [
          { key: 'id', label: '订单号', render: function (r) { return '<span class="mono">' + r.id + '</span>'; } },

          { key: 'paid_amount', label: '实付', num: true, render: function (r) { return UI.money2(r.paid_amount); } },
          { key: 'refund_amount', label: '退款', num: true, render: function (r) { return UI.money2(r.refund_amount); } },
          { key: 'status', label: '状态', render: function (r) { return r.status === 'paid' ? UI.badge('已支付', 'ok') : r.status === 'refunded' ? UI.badge('已退款', 'bad') : UI.badge('部分退款', 'warn'); } },

        ],

      }) + '<p class="hint" style="margin-top:6px">演示环境只显示最近 10 笔；导入真实数据后可按同样口径查看。</p></div>';

  function recentSkuOrdersTable(skuId) {
    var data = state.data;
    var orderMap = {};
    data.orders.forEach(function (o) { orderMap[o.id] = o; });
    var rows = [];
    data.order_items.forEach(function (it) {
      var o = orderMap[it.order_id];
      if (!o || it.sku_id !== skuId) return;
      if (state.month !== 'all' && o.order_date.slice(0, 7) !== state.month) return;
      if (state.store !== 'all' && o.store_id !== state.store) return;
      rows.push({ order_id: it.order_id, order_date: o.order_date, qty: it.qty, amount: it.amount, refund_amount: it.refund_amount, store: o.store_id });
    });
    rows = rows.slice(-10).reverse();
    if (!rows.length) return '';
    return '<div style="margin-top:16px"><div class="panel-head" style="padding:0 0 8px"><h3 style="font-size:13px">最近订单明细（' + rows.length + ' 笔）</h3></div>' + UI.table({
      columns: [
        { key: 'order_id', label: '订单号', render: function (r) { return '<span class="mono">' + r.order_id + '</span>'; } },
        { key: 'order_date', label: '下单日期' },
        { key: 'qty', label: '数量', num: true },
        { key: 'amount', label: '金额', num: true, render: function (r) { return UI.money2(r.amount); } },
        { key: 'refund_amount', label: '退款', num: true, render: function (r) { return UI.money2(r.refund_amount); } }
      ],
      rows: rows
    }) + '</div>';
  }

  // ---------------- 事件 ----------------
  function bindEvents() {
    document.addEventListener('click', function (e) {
      var navBtn = e.target.closest('[data-page]');
      if (navBtn && navBtn.classList.contains('nav-item') || navBtn && navBtn.classList.contains('btn')) {
        if (navBtn.getAttribute('data-page')) { go(navBtn.getAttribute('data-page')); return; }
      }
      var monthBtn = e.target.closest('[data-month]');
      if (monthBtn) { state.month = monthBtn.getAttribute('data-month'); render(); return; }
      var sortTh = e.target.closest('th[data-sort]');
      if (sortTh) {
        var key = sortTh.getAttribute('data-sort');
        var cur = state.sort[state.page] || {};
        state.sort[state.page] = { key: key, dir: cur.key === key && cur.dir === 'desc' ? 'asc' : 'desc' };
        render(); return;
      }
      var drillEl = e.target.closest('[data-drill]');
      if (drillEl) { drill(drillEl.getAttribute('data-drill'), drillEl.getAttribute('data-id')); return; }
      var alertEl = e.target.closest('[data-alert-index]');
      if (alertEl) {
        var a = state.model.alerts[Number(alertEl.getAttribute('data-alert-index'))];
        if (a && a.page) go(a.page === 'settlement' ? 'settlement' : a.page === 'stores' ? 'stores' : a.page);
        return;
      }
      var closeEl = e.target.closest('[data-close-modal]');
      if (closeEl) { UI.closeModal(); return; }
      var actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      var action = actionEl.getAttribute('data-action');
      if (action === 'go') { go(actionEl.getAttribute('data-page')); return; }
      if (action === 'print') { window.print(); return; }
      if (action === 'export') {
        if (!state.lastExport) { UI.toast('当前页面没有可导出的表格', 'err'); return; }
        UI.downloadCsv(state.lastExport.name, state.lastExport.headers, state.lastExport.rows);
        return;
      }
      if (action === 'template') {
        var tid = actionEl.getAttribute('data-table');
        var t = root.FinTemplates.getTable(tid);
        UI.download(t.label + '导入模板.csv', root.FinTemplates.templateCsv(tid), 'text/csv;charset=utf-8');
        return;
      }
      if (action === 'pick-file') {
        var input = document.querySelector('[data-import-file="' + actionEl.getAttribute('data-table') + '"]');
        if (input) input.click();
        return;
      }
      if (action === 'import-cancel') { state.import = null; render(); return; }
      if (action === 'apply-import') { applyImport(); return; }
      if (action === 'import-reset') { state.import = null; render(); return; }
      if (action === 'export-errors') {
        var res = state.import && state.import.result;
        if (!res) return;
        UI.downloadCsv('导入错误清单-' + res.tableId + '.csv', ['行号', '字段', '原值', '原因'],
          res.errors.map(function (x) { return [x.row, x.field, x.value, x.message]; }));
        return;
      }
      if (action === 'save-settings') { saveSettings(); return; }
      if (action === 'add-ladder') {
        var ed = document.getElementById('ladder-editor');
        var n = ed.querySelectorAll('[data-ladder-row]').length;
        var div = document.createElement('div');
        div.className = 'ladder-row';
        div.setAttribute('data-ladder-row', n);
        div.innerHTML = '<div class="field"><label>下限</label><input class="input num" data-ladder="min" value="0"></div>' +
          '<div class="field"><label>上限(空=不限)</label><input class="input num" data-ladder="max" value=""></div>' +
          '<div class="field"><label>提成率 %</label><input class="input num" data-ladder="rate" value="0"></div><span></span>' +
          '<button class="btn ghost small" data-action="del-ladder" data-index="' + n + '">✕</button>';
        ed.appendChild(div);
        return;
      }
      if (action === 'del-ladder') {
        var row = actionEl.closest('[data-ladder-row]');
        if (row) row.remove();
        return;
      }
      if (action === 'snapshot-export') {
        UI.download('电商财务数据快照-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(state.data, null, 1), 'application/json');
        return;
      }
      if (action === 'restore-demo') { restoreDemo(); return; }
    });

    document.addEventListener('change', function (e) {
      if (e.target.id === 'store-filter') {
        state.store = e.target.value;
        render();
        return;
      }
      var fileInput = e.target.closest('[data-import-file]');
      if (fileInput && fileInput.files && fileInput.files[0]) {
        importFile(fileInput.getAttribute('data-import-file'), fileInput.files[0]);
        fileInput.value = '';
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') UI.closeModal();
    });

    window.addEventListener('hashchange', function () {
      var page = (location.hash || '').replace(/^#\//, '');
      if (PAGE_META[page]) { state.page = page; render(); }
    });
  }

  function boot() {
    if (state.booted) return;
    state.booted = true;
    state.data = applySavedSettings(root.FinDemoData.buildDemoData());
    compute();
    renderSidebar();
    bindEvents();
    var page = (location.hash || '').replace(/^#\//, '');
    state.page = PAGE_META[page] ? page : 'overview';
    render();
  }

  root.App = {
    state: state,
    boot: boot,
    go: go,
    render: render,
    recompute: function () { compute(); render(); },
    drill: drill,
    scopeStores: scopeStores
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
