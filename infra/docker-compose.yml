# 本地环境：PostgreSQL + API（含前端静态页面）
# 用法：cp .env.example .env（填 JWT_SECRET）→ docker compose -f infra/docker-compose.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_only
      POSTGRES_DB: ecomfin
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecomfin"]
      interval: 5s
      retries: 10
  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://app:app_dev_only@db:5432/ecomfin?schema=public
      PORT: 3000
    ports: ["3000:3000"]
volumes:
  dbdata:
